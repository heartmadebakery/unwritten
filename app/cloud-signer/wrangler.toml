name = "unwritten-cloud-signer"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# Your Stream library ID (Stream → your library → API on bunny.net).
CLOUD_LIBRARY_ID = "793098"
# Where the web recorder is served, e.g. "https://you.github.io".
# "*" works for a first test; pin it down before real use.
CORS_ORIGIN = "*"

# Secrets — set with wrangler, never commit real values:
#   npx wrangler secret put CLOUD_API_KEY
#   paste -sd, tokens.txt | npx wrangler secret put SIGNER_TOKENS

# Hub store (D1, SQLite) behind the in-app hub. Create once, then fill
# in the real database_id it prints, and apply every migration in
# order. --remote is required: without it Wrangler migrates a local
# dev copy and the deployed store never gets the table.
#   npx wrangler d1 create unwritten-hub
#   npx wrangler d1 execute unwritten-hub --remote --file migrations/0001_sessions.sql
#   npx wrangler d1 execute unwritten-hub --remote --file migrations/0002_fetch_jobs.sql
#   npx wrangler d1 execute unwritten-hub --remote --file migrations/0003_ignored.sql
#   npx wrangler d1 execute unwritten-hub --remote --file migrations/0004_duration.sql
#   npx wrangler d1 execute unwritten-hub --remote --file migrations/0005_parts.sql
# Existing databases apply the files they are missing, then redeploy
# (the hub list reads ignored_videos, duration_seconds and
# session_parts: without 0003/0004/0005 it answers 503 naming the file).
[[d1_databases]]
binding = "DB"
database_name = "unwritten-hub"
database_id = "264c37f7-44bf-4786-8741-33c183f5ea47"
