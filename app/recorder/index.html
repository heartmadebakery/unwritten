<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Unwritten">
<meta name="theme-color" content="#17130E">
<meta name="description" content="Record one lesson, in the mentor's own words.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="stylesheet" href="app.css">
<title>Unwritten Craft</title>
</head>
<body>
<div id="app">
  <header>
    <h1>Unwritten Craft</h1>
    <p class="sub">Record, upload, and revisit craft lessons.</p>
  </header>
  <div id="status">Record a new lesson, upload a video, or open a published session below.</div>
  <div>
    <a class="bigbtn" id="gorecord" href="record.html">● Record</a>
    <a class="bigbtn" id="goupload" href="upload.html">⬆ Upload video</a>
    <div class="library"><h3>Hub</h3>
      <div id="hubstatus"></div>
      <div id="hubdetail"></div>
      <video id="hubplayer" class="hidden" controls playsinline preload="metadata"></video>
      <button id="hubclose" class="hidden backbtn" title="Close player">✕ Close</button>
      <div id="hublist"><div class="sempty">Loading…</div></div>
    </div>
  </div>
</div>
<script src="common.js"></script>
<script src="home.js"></script>
<script>
/* PWA: register the offline shell where supported (secure contexts
   only; old Safari without service workers simply skips this). */
if("serviceWorker" in navigator && window.isSecureContext){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
