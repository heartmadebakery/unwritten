<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Unwritten">
<meta name="theme-color" content="#17130E">
<meta name="description" content="Record one lesson, in the mentor's own words.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="stylesheet" href="app.css">
<title>Unwritten Craft</title>
</head>
<body>
<div id="app">
  <header class="largetitle">
    <h1>Unwritten Craft</h1>
    <p class="sub">Record, upload, and revisit craft lessons.</p>
  </header>
  <div id="status"></div>
  <div class="group">
    <a class="grow" id="gorecord" href="record.html">
      <span class="gicon rec" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="9"/></svg></span>
      <span class="glabel">Record<small>Film a lesson, the way you'd teach anyway</small></span>
      <span class="chev" aria-hidden="true"></span>
    </a>
    <a class="grow" id="goupload" href="upload.html">
      <span class="gicon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg></span>
      <span class="glabel">Upload video<small>From your library, Files, or a link</small></span>
      <span class="chev" aria-hidden="true"></span>
    </a>
  </div>
  <div class="library"><h3>Hub</h3>
    <div id="hubstatus"></div>
    <div id="hubdetail"></div>
    <video id="hubplayer" class="hidden" controls playsinline preload="metadata"></video>
    <button id="hubclose" class="hidden bigbtn" title="Close player">Close player</button>
    <div id="hublist" class="group"><div class="sempty">Loading…</div></div>
  </div>
</div>
<script src="common.js"></script>
<script src="home.js"></script>
<script>
/* PWA: register the offline shell where supported (secure contexts
   only; old Safari without service workers simply skips this). */
if("serviceWorker" in navigator && window.isSecureContext){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
