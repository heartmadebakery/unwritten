<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Unwritten">
<meta name="theme-color" content="#FAF6F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171310" media="(prefers-color-scheme: dark)">
<meta name="description" content="Record one lesson, in the mentor's own words.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="stylesheet" href="app.css">
<title>Upload · Unwritten Craft</title>
</head>
<body>
<div id="app">
  <header class="topbar">
    <a class="backbtn" id="backhome-upload" href="index.html" aria-label="Back to Home"><span class="bl">Home</span></a>
    <h1>Upload</h1>
    <div class="baraction"></div>
  </header>
  <div id="status"></div>
  <div id="joinbanner" class="joinbanner hidden" role="status"></div>
  <section class="card upcard" aria-labelledby="pickhead">
    <h2 id="pickhead">Upload a lesson video</h2>
    <p class="note">Pick a video file: it is saved as a session on this device and uploaded to Cloud, and the pipeline picks it up exactly like a recording.</p>
    <label class="dropzone" for="uploadinput">
      <span class="eglyph" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9.5 4.5 2.5-4.5 2.5z"/></svg></span>
      <b>Choose a video</b>
      <span id="pickname">From your library or Files</span>
    </label>
    <input type="file" id="uploadinput" accept="video/*" class="vh">
    <button class="pill primary block" id="uploadbtn">Upload</button>
    <div id="uploadstatus"></div>
  </section>
  <a class="card upcard linkrow" id="golink" href="link.html">
    <span class="eglyph" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></span>
    <span><b>Fetch from link</b><br><span class="note">A YouTube or video link, instead of a file</span></span>
  </a>
</div>
<script src="common.js"></script>
<script src="upload.js"></script>
<script>
/* PWA: register the offline shell where supported (secure contexts
   only; old Safari without service workers simply skips this). */
if("serviceWorker" in navigator && window.isSecureContext){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
